# tellurion-strategy · 单仓本地运行（ADR-036 G0）
# 用法：docker compose -f deploy/compose.yaml up --build
# 依赖：本机或容器可达的 PostgreSQL（默认 host.docker.internal:5432）。
# 编译器是批处理，不是常驻服务；镜像用 Dockerfile.compiler 单独构建。
name: tellurion-strategy

services:
  strategy:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tellurion-strategy:dev
    command: ["-addr", "0.0.0.0:8090", "-cache-dir", "/data/artifacts"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      STRATEGY_DATABASE_URL: ${STRATEGY_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/tellurion?sslmode=disable}
      # G1：容器内绑定 0.0.0.0，但端口只发布在宿主回环——显式声明这一点，
      # 无 secret 时才允许开放访问（启动闸见 kit DecideStartup）。
      # 凭证来源（QT-77）：strategy 是**验签方**，不持有 *_TOKEN；签发口径见
      # tellurion:docs/SPEC.md 的「服务间凭证」节。
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
    volumes:
      - strategy-artifacts:/data/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8090"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  strategy-artifacts: